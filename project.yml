name: SwiftTerminal
options:
  bundleIdPrefix: co.superduperai
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SuperDuperAnalytics:
    # Remote, not a relative path: Xcode Cloud resolves `../../shared/...` against the
    # checkout root and fails the archive looking for /Volumes/shared/superduperai-analytics.
    url: https://github.com/fortunto2/superduperai-analytics-swift.git
    from: "1.0.0"
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.12.0"
  SwiftTerm:
    url: https://github.com/fortunto2/SwiftTerm.git
    branch: stable-1.5.1-sync-output

targets:
  SwiftTerminalCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "18.0"
      macOS: "15.0"
    sources:
      - path: Sources/SwiftTerminalCore
    dependencies:
      - package: Citadel
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.swift-terminal-core
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACH_O_TYPE: staticlib

  SwiftTerminal:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/SwiftTerminal
    dependencies:
      - target: SwiftTerminalCore
      - package: SuperDuperAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.swift-terminal
        PRODUCT_NAME: "SuperDuper Terminal"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "SuperDuper Terminal"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Authenticate to access your SSH private keys"
        # An SSH client carries its own transport encryption (Citadel/SwiftNIO SSH) and
        # generates keys, so the honest answer is YES — the "exempt" answer covers apps whose
        # only crypto is authentication or the system HTTPS stack. Declared here rather than
        # left blank because App Store Connect will not accept the value over the public API.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "8N495BBBLM"
        CODE_SIGN_ENTITLEMENTS: SwiftTerminal.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    scheme:
      testTargets:
        - SwiftTerminalTests
      gatherCoverageData: true

  SwiftTerminalMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/SwiftTerminal
    dependencies:
      - target: SwiftTerminalCore
      - package: SuperDuperAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.swift-terminal-mac
        PRODUCT_NAME: "SuperDuper Terminal"
        CODE_SIGN_ENTITLEMENTS: SwiftTerminalMac.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "8"
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "SuperDuper Terminal"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        # An SSH client carries its own transport encryption (Citadel/SwiftNIO SSH) and
        # generates keys, so the honest answer is YES — the "exempt" answer covers apps whose
        # only crypto is authentication or the system HTTPS stack. Declared here rather than
        # left blank because App Store Connect will not accept the value over the public API.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "YES"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "8N495BBBLM"
        ENABLE_HARDENED_RUNTIME: "YES"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          CODE_SIGN_IDENTITY: "Apple Distribution"
    scheme:
      gatherCoverageData: false

  SwiftTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/SwiftTerminalTests
    dependencies:
      - target: SwiftTerminalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.superduperai.swift-terminal.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"

schemes:
  SwiftTerminal:
    build:
      targets:
        SwiftTerminal: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SwiftTerminalTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true

  SwiftTerminalMac:
    build:
      targets:
        SwiftTerminalMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
